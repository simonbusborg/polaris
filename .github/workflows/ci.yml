name: CI

on:
  push:
    # feature/** so work in progress is checked before it becomes a pull
    # request — this is what the widget spike had its own workflow for.
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle app
        run: make app
