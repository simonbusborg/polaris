name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Signing/notarization runs only when the secrets are configured; without
# them the release falls back to the old ad-hoc-signed build.
env:
  HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
  HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
  HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      # Full history and tags: the release notes are built from the commits
      # since the previous tag, which a shallow clone doesn't have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is one thing, not five that might each have happened: the
      # DMG, the notarization, the appcast entry and the cask all have to
      # land, or users see a version that half exists. Every secret is
      # checked before anything is published, so a missing one costs a red
      # run at second ten instead of a shipped build nobody can update to.
      # Forks have none of these secrets and are left to the per-step
      # guards below, which still produce an unsigned local build.
      - name: Preflight — every release secret is present
        if: github.repository == 'simonbusborg/polaris'
        run: |
          missing=""
          for name in HAS_SIGNING HAS_SPARKLE_KEY HAS_TAP_TOKEN; do
            eval "value=\$$name"
            [ "$value" = "true" ] || missing="$missing $name"
          done
          test -z "$missing" || {
            echo "Refusing to release: missing secrets for$missing"
            echo "Add them under Settings → Secrets → Actions, then re-run this tag."
            exit 1
          }

      # The update checker compares Info.plist's version against the
      # latest release tag — a mismatch would nag every user forever.
      - name: Verify tag matches Info.plist version
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG="${GITHUB_REF_NAME#v}"
          test "$PLIST" = "$TAG" || { echo "Info.plist has $PLIST but tag is $TAG"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Polaris.app
        # TEAM_ID prefixes the App Group the widget reads through; without it
        # the app still builds and signs, and the widget reports that it has
        # no container rather than guessing one.
        env:
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            make app IDENTITY="$IDENTITY" TEAM_ID="$TEAM_ID"
          else
            make app TEAM_ID="$TEAM_ID"
          fi

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          scripts/notarize.sh
          xcrun stapler staple Polaris.app

      - name: Package (dmg + zip)
        run: |
          make dmg
          ditto -c -k --keepParent Polaris.app Polaris.zip

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Polaris.dmg
            Polaris.zip
          generate_release_notes: true

      # Runs after the release exists: the appcast points at the release's
      # download URL, and a broken feed shouldn't hold up shipping the build
      # itself. Sparkle only trusts an appcast entry it can verify against the EdDSA
      # public key baked into Info.plist, so the zip is signed here and the
      # feed regenerated from that signature. The commit goes to main, which
      # is what GitHub Pages serves the feed from.
      # Fatal on purpose: a release users can't update to is worse than a
      # red run. It failed silently once, which is why it now traces what it
      # does and why the run goes red when it doesn't finish.
      - name: Sign the build for Sparkle and publish the appcast
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -x
          ls -la .build/artifacts || echo "no artifacts directory"
          find .build/artifacts -name 'sign_update*' || true
          SIGN=$(find .build/artifacts -type f -name sign_update | head -1)
          test -n "$SIGN" || { echo "sign_update missing from the Sparkle artifact"; exit 1; }
          chmod +x "$SIGN"
          # -s is deprecated and now exits non-zero; the key goes in a file.
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle.key
          ATTRS=$("$SIGN" Polaris.zip --ed-key-file sparkle.key)
          rm -f sparkle.key
          # sign_update prints its errors on stdout, so a bad key ends up
          # inside ATTRS and gets written into the appcast as garbage
          # attributes. Refuse anything that isn't a signature.
          case "$ATTRS" in
            sparkle:edSignature=*) ;;
            *) echo "sign_update did not return a signature: $ATTRS"; exit 1 ;;
          esac
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/release_notes.py "$GITHUB_REF_NAME"
          python3 scripts/update_appcast.py "$GITHUB_REF_NAME" "$BUILD" "$ATTRS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml docs/notes
          git commit -m "Publish $GITHUB_REF_NAME to the Sparkle appcast"
          git push origin main

      # The cask lives in simonbusborg/homebrew-polaris and points at this
      # release's DMG, so it can only be written once the release exists.
      # Like the appcast, this is part of the release rather than a nicety:
      # `brew upgrade` pointing at an older version is a bug report waiting
      # to happen.
      - name: Update the Homebrew cask
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -x
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 Polaris.dmg | awk '{print $1}')
          git clone "https://x-access-token:$GH_TOKEN@github.com/simonbusborg/homebrew-polaris.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" Casks/polaris.rb
          git diff --quiet && { echo "cask already at $VERSION"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the cask to $VERSION"
          git push origin main

      # Reads back what the world can actually see. Everything above could
      # succeed while the feed or the cask still points somewhere else — a
      # stale gh-pages deploy, a race with another push — and only this
      # step would notice.
      - name: Verify the published release is complete
        if: github.repository == 'simonbusborg/polaris'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort > assets.txt
          grep -qx Polaris.dmg assets.txt || { echo "release is missing Polaris.dmg"; exit 1; }
          grep -qx Polaris.zip assets.txt || { echo "release is missing Polaris.zip"; exit 1; }
          git fetch origin main
          git show origin/main:docs/appcast.xml > feed.xml
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" feed.xml \
            || { echo "appcast has no entry for $VERSION"; exit 1; }
          grep -q 'sparkle:edSignature="' feed.xml \
            || { echo "appcast entry for $VERSION carries no signature"; exit 1; }
          CASK=$(curl -fsSL https://raw.githubusercontent.com/simonbusborg/homebrew-polaris/main/Casks/polaris.rb)
          echo "$CASK" | grep -q "version \"$VERSION\"" \
            || { echo "the Homebrew cask is not on $VERSION"; exit 1; }
          echo "release $VERSION is complete: assets, appcast and cask all agree"
