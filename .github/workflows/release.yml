name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Signing/notarization runs only when the secrets are configured; without
# them the release falls back to the old ad-hoc-signed build.
env:
  HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
  HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The update checker compares Info.plist's version against the
      # latest release tag — a mismatch would nag every user forever.
      - name: Verify tag matches Info.plist version
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG="${GITHUB_REF_NAME#v}"
          test "$PLIST" = "$TAG" || { echo "Info.plist has $PLIST but tag is $TAG"; exit 1; }

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 1800 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Polaris.app
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            make app IDENTITY="$IDENTITY"
          else
            make app
          fi

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent Polaris.app notarize.zip
          # --wait exits 0 even when the verdict is Invalid, and the verdict
          # alone doesn't say what Apple objected to. Fetch the log and fail
          # on it, or a rejection turns into a confusing stapler error.
          ID=$(xcrun notarytool submit notarize.zip \
                 --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
                 --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          xcrun notarytool wait "$ID" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" || true
          xcrun notarytool log "$ID" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" notary.json || true
          cat notary.json
          python3 -c 'import json,sys; d=json.load(open("notary.json")); sys.exit(0 if d.get("status")=="Accepted" else 1)'
          xcrun stapler staple Polaris.app

      - name: Package (dmg + zip)
        run: |
          make dmg
          ditto -c -k --keepParent Polaris.app Polaris.zip

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Polaris.dmg
            Polaris.zip
          generate_release_notes: true

      # Runs after the release exists: the appcast points at the release's
      # download URL, and a broken feed shouldn't hold up shipping the build
      # itself. Sparkle only trusts an appcast entry it can verify against the EdDSA
      # public key baked into Info.plist, so the zip is signed here and the
      # feed regenerated from that signature. The commit goes to main, which
      # is what GitHub Pages serves the feed from.
      # Never fatal: the release is already published by this point, and the
      # feed can be regenerated from the released zip afterwards. It failed
      # silently once, which is why it now traces what it does.
      - name: Sign the build for Sparkle and publish the appcast
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        continue-on-error: true
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -x
          ls -la .build/artifacts || echo "no artifacts directory"
          find .build/artifacts -name 'sign_update*' || true
          SIGN=$(find .build/artifacts -type f -name sign_update | head -1)
          test -n "$SIGN" || { echo "sign_update missing from the Sparkle artifact"; exit 1; }
          chmod +x "$SIGN"
          # -s is deprecated and now exits non-zero; the key goes in a file.
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle.key
          ATTRS=$("$SIGN" Polaris.zip --ed-key-file sparkle.key)
          rm -f sparkle.key
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update_appcast.py "$GITHUB_REF_NAME" "$BUILD" "$ATTRS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Publish $GITHUB_REF_NAME to the Sparkle appcast"
          git push origin main
